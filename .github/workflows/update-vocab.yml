name: Update Vocabulary System

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/build_examples.py'
      - 'data/ai-original-examples*.json'
      - '.github/workflows/update-vocab.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python syntax
        run: python3 -m py_compile tools/build_examples.py

      - name: Build AI-original example system
        run: python3 tools/build_examples.py

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Validate generated vocabulary data
        run: |
          python3 - <<'PY'
          import glob,json
          e=json.load(open('data/vocabulary-examples.json',encoding='utf-8'))
          s=json.load(open('data/vocabulary-example-sources.json',encoding='utf-8'))
          merged={}
          for path in ['data/ai-original-examples.json']+sorted(glob.glob('data/ai-original-examples-batch-*.json')):
              p=json.load(open(path,encoding='utf-8'))
              assert p.get('version') == '1.5.1'
              merged.update(p.get('words',p.get('examples',{})))
          assert e.get('version') == '1.5.1'
          assert len(e.get('words',{})) >= 6000
          assert e.get('summary',{}).get('aiOriginalReady',0) > 0
          assert e.get('summary',{}).get('aiOriginalInput',0) == len(merged)
          assert e['words']['absence']['status'] == 'ready'
          assert e['words']['absence']['zh']
          assert 'chatgpt_original' in s.get('sources',{})
          assert len(merged) >= 200
          print('Version:', e.get('version'))
          print('Summary:', e.get('summary'))
          print('Merged AI originals:', len(merged))
          print('Sources:', list(s.get('sources',{})))
          PY

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles.css sw.js data/*.json tools/build_examples.py
          git diff --cached --quiet || git commit -m "data: build V1.5.1 AI-original examples"
          git push
