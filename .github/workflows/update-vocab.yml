name: Update Vocabulary System

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/update_vocab.py'
      - '.github/workflows/update-vocab.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update vocabulary system
        run: python3 tools/update_vocab.py

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Validate generated vocabulary data
        run: |
          python3 - <<'PY'
          import json
          e=json.load(open('data/vocabulary-examples.json',encoding='utf-8'))
          assert len(e.get('words',{})) >= 6000
          assert e['words']['absence']['source'] == 'manual'
          assert e['words']['absence']['zh']
          print('Version:', e.get('version'))
          print('Summary:', e.get('summary'))
          PY

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles.css sw.js data/*.json
          git diff --cached --quiet || git commit -m "data: update vocabulary system [skip ci]"
          git push
