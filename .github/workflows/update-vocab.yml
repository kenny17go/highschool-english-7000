name: Update Vocabulary System

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/update_vocab.py'
      - 'tools/build_examples.py'
      - '.github/workflows/update-vocab.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install example-engine dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install nltk
          python3 - <<'PY'
          import nltk
          nltk.download('wordnet')
          nltk.download('omw-1.4')
          PY

      - name: Check Python syntax
        run: |
          python3 -m py_compile tools/update_vocab.py tools/build_examples.py

      - name: Update vocabulary system
        run: python3 tools/update_vocab.py

      - name: Build full example engine
        run: python3 tools/build_examples.py

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Validate generated vocabulary data
        run: |
          python3 - <<'PY'
          import json
          e=json.load(open('data/vocabulary-examples.json',encoding='utf-8'))
          s=json.load(open('data/vocabulary-example-sources.json',encoding='utf-8'))
          assert e.get('version') == '1.4.8'
          assert len(e.get('words',{})) >= 6000
          assert e['words']['absence']['status'] == 'ready'
          assert e['words']['absence']['zh']
          assert 'qualityGrades' in e.get('summary',{})
          assert 'words_tw_reference' in s.get('sources',{})
          print('Version:', e.get('version'))
          print('Summary:', e.get('summary'))
          print('Sources:', list(s.get('sources',{})))
          PY

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles.css sw.js data/*.json tools/build_examples.py
          git diff --cached --quiet || git commit -m "data: build V1.4.8 full example engine [skip ci]"
          git push
