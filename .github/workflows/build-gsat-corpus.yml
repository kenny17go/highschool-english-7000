name: Build GSAT corpus

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/build_gsat_corpus.py'
      - '.github/workflows/build-gsat-corpus.yml'

permissions:
  contents: write

jobs:
  corpus:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PDF text tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Build 101-115 English corpus statistics
        run: python3 tools/build_gsat_corpus.py

      - name: Validate corpus
        run: |
          python3 - <<'PY'
          import json

          with open('data/gsat-corpus-stats.json', encoding='utf-8') as f:
              x = json.load(f)

          assert x['summary']['papers'] == 15
          assert all(str(y) in x['years'] for y in range(101, 116))
          assert x['summary']['tokens'] > 10000

          print(x['summary'])
          PY

      - name: Commit generated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gsat-corpus-stats.json
          git diff --cached --quiet || git commit -m "data: rebuild GSAT 101-115 corpus [skip ci]"
          git push
