name: Apply V1.5.3 quiz explanations

on:
  push:
    paths:
      - '.github/workflows/v153-quiz-explanations.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python tools/apply_v153.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app.js styles.css sw.js tools/build_examples.py
          git commit -m 'feat: add V1.5.3 quiz explanations and ChatGPT help'
          git push
