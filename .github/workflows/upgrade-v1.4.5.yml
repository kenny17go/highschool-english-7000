name: Upgrade V1.4.5 examples

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/apply_v145.py'
      - '.github/workflows/upgrade-v1.4.5.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install WordNet
        run: |
          python3 -m pip install --disable-pip-version-check nltk
          python3 -m nltk.downloader -q wordnet omw-1.4
      - name: Apply V1.4.5
        run: python3 tools/apply_v145.py
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Validate example data
        run: |
          python3 - <<'PY'
          import json
          e=json.load(open('data/vocabulary-examples.json',encoding='utf-8'))
          a=json.load(open('data/vocabulary-quality-audit.json',encoding='utf-8'))
          assert e['version']=='1.4.5'
          assert len(e['words'])>=6000
          assert e['words']['absence']['source']=='manual'
          assert e['words']['absence']['zh']
          assert a['version']=='1.4.5'
          print(e['summary'])
          print(a['summary'])
          PY
      - name: Commit V1.4.5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles.css sw.js data/vocabulary-examples.json data/vocabulary-quality-audit.json
          git diff --cached --quiet || git commit -m "feat: V1.4.5 bilingual examples and quality audit [skip ci]"
          git push
